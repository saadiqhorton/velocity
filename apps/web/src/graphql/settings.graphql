fragment GithubInstallFields on GithubInstall {
  id
  installationId
  accountLogin
  accountType
  repos
  autoCloseOnMerge
  issueSync
  issueSyncTeamId
  repoTeamMap
  backfillStatus
  backfillProgress
  suspendedAt
  createdAt
}

query Integrations {
  githubIntegration {
    configured
    source
    appName
    installUrl
    installs {
      ...GithubInstallFields
    }
  }
  mcpInfo {
    httpEnabled
    httpEndpoint
    serverUrl
    stdioCommand
  }
}

mutation BeginGithubAppSetup($organization: String) {
