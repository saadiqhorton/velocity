query WorkspaceSettings {
  workspace {
    name
    slug
    timezone
    locale
    createdAt
    deletionRequestedAt
    deletionScheduledFor
  }
}

mutation UpdateWorkspace($input: UpdateWorkspaceInput!) {
  updateWorkspace(input: $input) {
    name
    slug
    timezone
    locale
  }
}

mutation RequestWorkspaceDeletion($confirmName: String!) {
  requestWorkspaceDeletion(confirmName: $confirmName) {
    name
    deletionRequestedAt
    deletionScheduledFor
  }
}

mutation CancelWorkspaceDeletion {
  cancelWorkspaceDeletion {
    name
    deletionRequestedAt
    deletionScheduledFor
  }
}

query Members {
  users(includeSuspended: true) {
    ...UserFields
    email
    createdAt
  }
  invites {
    id
    name
    createdAt
    expiresAt
  }
}

mutation CreateInvite($name: String, $expiresInDays: Int) {
  createInvite(name: $name, expiresInDays: $expiresInDays) {
    id
    name
    url
    createdAt
    expiresAt
  }
}

mutation RevokeInvite($id: ID!) {
  revokeInvite(id: $id)
}

mutation SetMemberSuspended($userId: ID!, $suspended: Boolean!) {
  setMemberSuspended(userId: $userId, suspended: $suspended) {
    id
    suspended
  }
}

mutation SetMemberPassword($userId: ID!, $password: String!) {
  setMemberPassword(userId: $userId, password: $password)
}

mutation RemoveMember($userId: ID!) {
  removeMember(userId: $userId)
}

mutation CreateTeam($input: CreateTeamInput!) {
  createTeam(input: $input) {
    ...TeamFields
  }
}

mutation UpdateTeam($id: ID!, $input: UpdateTeamInput!) {
  updateTeam(id: $id, input: $input) {
    ...TeamFields
  }
}

mutation ArchiveTeam($id: ID!, $archived: Boolean!) {
  archiveTeam(id: $id, archived: $archived) {
    id
    archivedAt
  }
}

mutation DeleteTeam($id: ID!, $confirmKey: String!, $moveIssuesToTeamId: ID) {
  deleteTeam(id: $id, confirmKey: $confirmKey, moveIssuesToTeamId: $moveIssuesToTeamId)
}

mutation ReorderTeam($id: ID!, $beforeId: ID, $afterId: ID) {
  reorderTeam(id: $id, beforeId: $beforeId, afterId: $afterId) {
    id
    sortOrder
  }
}

query TeamMembers($id: ID!) {
