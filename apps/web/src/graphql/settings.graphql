    ...StatusFields
  }
}

mutation DeleteStatus($id: ID!, $replacementStatusId: ID) {
  deleteStatus(id: $id, replacementStatusId: $replacementStatusId)
}

mutation ReorderStatus($id: ID!, $beforeId: ID, $afterId: ID) {
  reorderStatus(id: $id, beforeId: $beforeId, afterId: $afterId) {
