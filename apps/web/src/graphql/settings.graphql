}

mutation UninstallGithub($installId: ID!) {
  uninstallGithub(installId: $installId)
}

fragment WebhookFields on Webhook {
  id
  url
  description
  enabled
  eventTypes
  createdAt
  updatedAt
}

query Webhooks {
  webhooks {
    ...WebhookFields
  }
}

query WebhookDeliveries($webhookId: ID!, $first: Int, $offset: Int) {
  webhook(id: $webhookId) {
    ...WebhookFields
  }
  webhookDeliveries(webhookId: $webhookId, first: $first, offset: $offset) {
    totalCount
    nodes {
      id
      eventType
      status
      statusCode
      attempt
      createdAt
      deliveredAt
      durationMs
      nextRetryAt
      error
      payload
    }
  }
}

mutation CreateWebhook($input: WebhookInput!) {
  createWebhook(input: $input) {
    secret
    webhook {
      ...WebhookFields
    }
  }
}

mutation UpdateWebhook($id: ID!, $input: WebhookInput!) {
  updateWebhook(id: $id, input: $input) {
    ...WebhookFields
  }
}

mutation DeleteWebhook($id: ID!) {
  deleteWebhook(id: $id)
}

mutation TestWebhook($id: ID!) {
  testWebhook(id: $id) {
    id
    status
    statusCode
    eventType
    createdAt
  }
}

mutation RedeliverWebhook($deliveryId: ID!) {
  redeliverWebhook(deliveryId: $deliveryId) {
    id
    status
    statusCode
    attempt
    createdAt
  }
}

mutation RotateWebhookSecret($id: ID!) {
  rotateWebhookSecret(id: $id)
}

mutation RevealWebhookSecret($id: ID!) {
  revealWebhookSecret(id: $id)
}

