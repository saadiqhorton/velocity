}

mutation GithubCompleteInstall($installationId: Int!) {
  githubCompleteInstall(installationId: $installationId) {
    ...GithubInstallFields
  }
}

mutation UpdateGithubSettings($installId: ID!, $input: GithubSettingsInput!) {
  updateGithubSettings(installId: $installId, input: $input) {
    ...GithubInstallFields
  }
}

mutation GithubStartBackfill($installId: ID!) {
  githubStartBackfill(installId: $installId)
}

mutation GithubCancelBackfill($installId: ID!) {
