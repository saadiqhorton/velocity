query AuditLog($first: Int, $offset: Int, $action: String, $actorUserId: ID, $before: DateTime, $after: DateTime) {
  auditLog(first: $first, offset: $offset, action: $action, actorUserId: $actorUserId, before: $before, after: $after) {
    totalCount
    nodes {
      id
      action
      createdAt
      objectType
      objectId
      ip
      changes
      actorApiKeyId
      actorMcpSessionId
      actor {
        id
        name
      }
    }
  }
}
