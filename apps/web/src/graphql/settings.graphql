query ApiKeys($all: Boolean) {
  apiKeys(all: $all) {
    id
    name
    prefix
    scope
    createdAt
    lastUsedAt
    expiresAt
    user {
      id
      name
    }
    mutationsPerHour {
      hour
      count
    }
  }
}

mutation CreateApiKey($name: String!, $scope: ApiKeyScope!, $expiresInDays: Int) {
  createApiKey(name: $name, scope: $scope, expiresInDays: $expiresInDays) {
    plaintext
    apiKey {
      id
      name
      prefix
      scope
      createdAt
      lastUsedAt
      expiresAt
      user {
        id
        name
      }
      mutationsPerHour {
        hour
        count
      }
    }
  }
}

mutation RevokeApiKey($id: ID!) {
  revokeApiKey(id: $id)
}

