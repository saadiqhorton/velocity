query TeamsMemberCounts {
  teams {
    id
    members {
      id
    }
  }
}

query TeamsAdmin {
  teams(includeArchived: true) {
    ...TeamFields
  }
}

fragment WorkspaceFeaturesFields on WorkspaceFeatures {
  cycles
  estimates
  insights
  members
  solo
}

mutation UpdateWorkspaceFeatures($input: WorkspaceFeaturesInput!) {
  updateWorkspaceFeatures(input: $input) {
    slug
    features {
      ...WorkspaceFeaturesFields
    }
  }
}
