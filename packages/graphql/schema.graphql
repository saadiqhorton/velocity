}

enum StatusCategory {
  backlog
  canceled
  done
  in_progress
  todo
}

type SubIssueRollup {
  done: Int!
  total: Int!
}

type Subscription {
  importProgress(runId: ID!): ImportRun
  issueCreated(teamId: ID): Issue
  issueUpdated(issueId: ID): Issue
  notificationCreated: Notification
  workspaceEvents: WorkspaceEvent!
}

"""Teams are categories for work with their own issue prefix (SPEC §3.4)."""
type Team {
  activeCycle: Cycle
  archivedAt: DateTime
  carryOver: CarryOver!
  color: PaletteColor!
  createdAt: DateTime!
  cycleEnabled: Boolean!
  cycleLengthWeeks: Int!

  """0 = Sunday … 6 = Saturday"""
  cycleStartDay: Int!
  cycleTimezone: String!
  cycles(first: Int, includeClosed: Boolean): [Cycle!]!
  description: String
  estimateScale: EstimateScale!
  icon: String
  id: ID!
  key: String!
  members: [User!]!
  name: String!
  openIssueCount: Int!
  sortOrder: Float!
  statuses: [WorkflowStatus!]!
  upcomingCycles: [Cycle!]!
}

type TeamVelocity {
  cycles: [TeamVelocityCycle!]!
  key: String!
  name: String!
  teamId: ID!
}

type TeamVelocityCycle {
  completedCount: Int!
  completedPoints: Int!
  cycleId: ID!
  number: Int!
  scopePoints: Int!
}

enum Theme {
  dark
  light
  system
}

