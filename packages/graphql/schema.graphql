"""
A workspace member. Every member is a peer; the owner can administer the workspace (SPEC §3.2.3).
"""
type User {
  avatarUrl: String
  createdAt: DateTime!
  email: String
  id: ID!
  isMe: Boolean!
  isOwner: Boolean!
  locale: String!
  name: String!

  """
  Your saved coding tools, or null until settings are saved. Hidden on other members.
  """
  preferences: UserPreferences
  removed: Boolean!
  suspended: Boolean!
  theme: Theme!
  timezone: String!
  username: String!
}

type UserPreferences {
  codingTools: [CodingTool!]!
  promptInstructions: String!
}

type Velocity {
  count: Float!
  history: [VelocityPoint!]!

  """Average completed points of the last cycles."""
  points: Float!
}

type VelocityPoint {
  completedCount: Int!
  completedPoints: Int!
  cycleId: ID!
  number: Int!
  scopePoints: Int!
}

"""
Saved, personal view (SPEC §3.10). `filter` is canonical DSL; share by URL.
"""
type View {
  color: PaletteColor
  createdAt: DateTime!
  display: ViewDisplay!
  filter: String!
  icon: String
  id: ID!
  isMine: Boolean!
  name: String!
  owner: User
  slug: String!
  team: Team
  teamId: ID
  updatedAt: DateTime!
}

type ViewDisplay {
  columns: [String!]!
  grouping: GroupBy!
  layout: Layout!
  ordering: Ordering!
  showCompleted: String!
  showEmptyGroups: Boolean!
  showSubIssues: Boolean!
}

input ViewDisplayInput {
  columns: [String!]
  grouping: GroupBy
  layout: Layout
  ordering: Ordering
  showCompleted: String
  showEmptyGroups: Boolean
  showSubIssues: Boolean
}

input ViewInput {
  color: PaletteColor
  display: ViewDisplayInput

  """Filter DSL; stored canonicalized."""
  filter: String
  icon: String
  name: String
  teamId: ID
}

type Webhook {
  createdAt: DateTime!
