  addLabelIds: [ID!]
  assigneeId: ID
  cycleId: ID
  descriptionMd: String
  estimate: Int
  labelIds: [ID!]
  milestoneId: ID
  parentId: ID
  priority: Int
  projectId: ID
  removeLabelIds: [ID!]
  statusId: ID
  title: String
}

input UpdateLabelInput {
  color: PaletteColor
  description: String
  name: String
  parentId: ID
}

input UpdatePreferencesInput {
  codingTools: [CodingToolInput!]!
  promptInstructions: String!
}

input UpdateProfileInput {
  email: String
  locale: String
  name: String
  theme: Theme
  timezone: String
  username: String
}

input UpdateStatusInput {
  category: StatusCategory
  color: PaletteColor
  description: String
  name: String
}

input UpdateTeamInput {
  carryOver: CarryOver
  color: PaletteColor
  cycleEnabled: Boolean
  cycleLengthWeeks: Int
  cycleStartDay: Int
  cycleTimezone: String
  description: String
  estimateScale: EstimateScale
  icon: String
  key: String
  name: String
}

