packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: false
# No fixed release exists for this dev-only codegen glob dependency (docs/security-review.md).
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
# Force patched transitive versions (docs/security-review.md):
# GHSA-7mx3-vvmw-hjmv utils; GHSA-jm63-cq47-j5jp, GHSA-46jr-4wx8-v453 MCP server (e2e pins 2.2.0);
# GHSA-mrhx-c7xc-m3w5 zod; GHSA-27r3-jxmh-p828 body-parser; GHSA-xjj6-f33q-929c undici;
# GHSA-587h-7wmj-h5pm vite.
overrides:
  '@graphql-tools/utils': '^12.0.3'
  '@modelcontextprotocol/server': '~2.3.1'
  zod: '^4.6.7'
  body-parser: '^2.4.0'
  'undici@7': '^7.30.1'
  vite: '^8.3.3'
minimumReleaseAgeExclude:
