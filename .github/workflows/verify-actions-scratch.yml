# Branch-only harness for the action bumps on chore/bump-ci-actions.
#
# A branch push never runs release.yml, so the release-only action surface
# (login, metadata, cosign-installer, download-artifact) would otherwise be
# merged unverified. This workflow exercises it without publishing anything:
# no image push, no signature, no release. Delete before merging.
name: verify-actions-scratch

on:
  push:
    branches: [chore/bump-ci-actions]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-action-surface:
    name: release action surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage an artifact
        run: |
          mkdir -p "$RUNNER_TEMP/rt"
          echo "artifact-round-trip-ok" > "$RUNNER_TEMP/rt/probe.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: rt-probe
          path: ${{ runner.temp }}/rt/probe.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: rt-probe
          path: ${{ runner.temp }}/rt-down
      - name: Assert the artifact round-tripped
        run: test "$(cat "$RUNNER_TEMP/rt-down/probe.txt")" = "artifact-round-trip-ok"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=verify
      - name: Assert metadata-action produced tags
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}"
          test -n "${{ steps.meta.outputs.tags }}"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: velocity:verify
          build-args: |
            VERSION=verify
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert the image built, loaded and is sane
        run: |
          test -n "${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint id velocity:verify -u | grep -qx 10001

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Assert cosign is installed
        run: cosign version

      - name: SBOM with syft against the loaded image
        uses: anchore/sbom-action@v0
        with:
          image: velocity:verify
          format: spdx-json
          output-file: sbom-verify.spdx.json
          artifact-name: sbom-verify.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Assert the SBOM is real
        run: |
          python3 -c 'import json,sys; d=json.load(open("sbom-verify.spdx.json")); print("spdxVersion:", d["spdxVersion"], "| packages:", len(d["packages"])); sys.exit(0 if d["spdxVersion"].startswith("SPDX-") and len(d["packages"])>0 else 1)'
