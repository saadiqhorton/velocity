name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --test scripts/*.test.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velocity
          POSTGRES_PASSWORD: velocity
          POSTGRES_DB: velocity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velocity -d velocity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://velocity:velocity@localhost:5432/velocity_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velocity
          POSTGRES_PASSWORD: velocity
          POSTGRES_DB: velocity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velocity -d velocity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://velocity:velocity@localhost:5432/velocity
      TEST_DATABASE_URL: postgres://velocity:velocity@localhost:5432/velocity
      APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@velocity/server --filter=@velocity/web
      - name: Install Playwright browsers
        run: pnpm --filter @velocity/web exec playwright install --with-deps chromium webkit
      # The visual baselines run in the `visual` job (Playwright image); everything else runs here.
      - run: pnpm --filter @velocity/web exec playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Visual baselines (apps/web/e2e/0-visual.spec.ts, Chromium). They are captured locally with
  # apps/web/scripts/visual-docker.sh in this same image, so fonts render identically here.
  # Keep the tag in step with @playwright/test in apps/web/package.json.
  visual:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velocity
          POSTGRES_PASSWORD: velocity
          POSTGRES_DB: velocity
        options: >-
          --health-cmd "pg_isready -U velocity -d velocity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Inside a job container the service is reached by its label, not localhost.
      DATABASE_URL: postgres://velocity:velocity@postgres:5432/velocity
      TEST_DATABASE_URL: postgres://velocity:velocity@postgres:5432/velocity
      APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@velocity/server --filter=@velocity/web
      # The image already contains the matching browsers; no `playwright install`.
      - run: pnpm --filter @velocity/web exec playwright test e2e/0-visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, e2e, visual, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: velocity:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image sanity checks
        run: |
          docker run --rm --entrypoint pg_dump velocity:ci --version | grep -q ' 16\.'
          docker run --rm --entrypoint id velocity:ci -u | grep -qx 10001
      - name: Validate compose file
        run: |
          printf 'POSTGRES_PASSWORD=ci\nAPP_SECRET=%s\n' "$(printf 'a%.0s' {1..40})" > .env
          docker compose config -q
          docker compose --profile scale --profile clamav config -q
      - name: Smoke test built image through Compose
        env:
          VELOCITY_IMAGE: velocity:ci
          POSTGRES_PASSWORD: ci
          APP_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
        run: |
          set -euo pipefail
          project="velocity-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose -p "$project" -f docker-compose.yml -f scripts/deploy/compose.smoke.yml)
          cleanup() {
            status=$?
            if (( status != 0 )); then "${compose[@]}" logs --tail=100 app postgres caddy || true; fi
            "${compose[@]}" down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          "${compose[@]}" up -d --no-build postgres app caddy
          ready=0
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8089/readyz >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if (( ready == 0 )); then echo 'Compose deployment did not become ready' >&2; exit 1; fi
          node scripts/deploy/smoke.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, e2e, visual, audit, docker]
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
